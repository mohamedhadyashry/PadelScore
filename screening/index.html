<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Twofold Screening</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Layout: sticky top bar with tabs; screening is a two-pane reader (record list | abstract), stacking on phones. */
:root {
  --bg: #f3f5f7; --surface: #ffffff; --sunk: #e8ecf0; --line: #d3dae1;
  --fg: #18222d; --muted: #5b6977; --accent: #2b5c8a; --accent-ink: #ffffff;
  --inc: #23784a; --inc-soft: #dcefe3; --exc: #b2412f; --exc-soft: #f6e0db;
  --may: #9a6a10; --may-soft: #f5ead3; --hl-inc: #c9ecd5; --hl-exc: #f7d3cb;
  --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11171d; --surface: #19212a; --sunk: #0d1318; --line: #2b3742;
  --fg: #e3e9ef; --muted: #93a2b0; --accent: #7fb0de; --accent-ink: #0d1318;
  --inc: #6cc795; --inc-soft: #183626; --exc: #f08a78; --exc-soft: #3d1f1a;
  --may: #e3b75c; --may-soft: #3a2e14; --hl-inc: #1f4a33; --hl-exc: #552a22;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #11171d; --surface: #19212a; --sunk: #0d1318; --line: #2b3742;
  --fg: #e3e9ef; --muted: #93a2b0; --accent: #7fb0de; --accent-ink: #0d1318;
  --inc: #6cc795; --inc-soft: #183626; --exc: #f08a78; --exc-soft: #3d1f1a;
  --may: #e3b75c; --may-soft: #3a2e14; --hl-inc: #1f4a33; --hl-exc: #552a22;
  color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font: 14px/1.5 var(--sans); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1320px; margin: 0 auto; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
h2 { font: 600 20px/1.3 var(--sans); }
h3 { font: 600 15px/1.3 var(--sans); }
p { margin: 0; }
.muted { color: var(--muted); }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.label { font: 500 11px/1.2 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 12px 20px; flex-wrap: wrap; padding-block: 10px; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand b { font: 600 17px/1 var(--serif); letter-spacing: .01em; }
.brand .proj { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; }
nav.tabs { display: flex; gap: 2px; flex-wrap: wrap; }
nav.tabs button { border: 0; background: none; color: var(--muted); font: 500 14px var(--sans); padding: 7px 11px; border-radius: 6px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
nav.tabs button:hover { color: var(--fg); background: var(--sunk); }
nav.tabs button[aria-selected="true"] { color: var(--fg); background: var(--sunk); box-shadow: inset 0 -2px 0 var(--accent); }
.count { font: 500 11px/1 var(--mono); background: var(--line); color: var(--fg); border-radius: 9px; padding: 3px 6px; }
.count.warn { background: var(--may-soft); color: var(--may); }
.who { margin-left: auto; display: flex; align-items: center; gap: 8px; }

main { padding-block: 20px 60px; }
section.view { display: grid; gap: 18px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 18px; display: grid; gap: 12px; min-width: 0; }
.row { display: flex; gap: 8px 10px; flex-wrap: wrap; align-items: center; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; }

button, .btn { font: 500 14px var(--sans); border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 6px; padding: 7px 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
button:hover, .btn:hover { border-color: var(--muted); }
button.primary, .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
button.danger { color: var(--exc); }
button:disabled { opacity: .45; cursor: default; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .btn:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
input[type="text"], input[type="search"], select, textarea { font: 14px var(--sans); color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; min-width: 0; }
textarea { width: 100%; resize: vertical; }
.btn input[type="file"] { position: absolute; width: 1px; height: 1px; opacity: 0; }
.btn { position: relative; }
kbd { font: 500 11px var(--mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; color: var(--muted); }

.drop { border: 2px dashed var(--line); border-radius: 8px; padding: 22px; text-align: center; display: grid; gap: 10px; justify-items: center; }
.drop.over { border-color: var(--accent); background: var(--sunk); }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 6px 9px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { background: var(--sunk); font-weight: 500; white-space: nowrap; }
td.clip { max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.maprow { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.maprow label { display: grid; gap: 4px; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.stat { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; background: var(--surface); }
.stat .n { font: 500 22px/1.2 var(--mono); font-variant-numeric: tabular-nums; }

.pill { display: inline-flex; align-items: center; gap: 4px; font: 500 12px/1 var(--sans); padding: 4px 8px; border-radius: 10px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.pill.include { background: var(--inc-soft); color: var(--inc); }
.pill.exclude { background: var(--exc-soft); color: var(--exc); }
.pill.maybe { background: var(--may-soft); color: var(--may); }
.pill.reason { background: var(--sunk); color: var(--fg); }

/* Screening */
.screen { display: grid; grid-template-columns: minmax(260px, 340px) minmax(0, 1fr); gap: 18px; align-items: start; }
.listpane { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 70px); display: grid; gap: 8px; max-height: calc(100vh - 100px); min-width: 0; }
.filters { display: flex; gap: 4px; flex-wrap: wrap; }
.filters button { padding: 4px 8px; font-size: 12px; }
.filters button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.reclist { overflow-y: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); min-height: 120px; }
.reclist button { display: grid; grid-template-columns: 10px 1fr; gap: 9px; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; padding: 9px 11px; background: none; font-weight: 400; }
.reclist button:hover { background: var(--sunk); }
.reclist button.cur { background: var(--sunk); box-shadow: inset 3px 0 0 var(--accent); }
.reclist .t { font-size: 13px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.reclist .s { font-size: 12px; color: var(--muted); }
.dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 4px; border: 1.5px solid var(--line); }
.dot.include { background: var(--inc); border-color: var(--inc); }
.dot.exclude { background: var(--exc); border-color: var(--exc); }
.dot.maybe { background: var(--may); border-color: var(--may); }
.progress { height: 6px; background: var(--sunk); border-radius: 3px; overflow: hidden; display: flex; }
.progress i { display: block; height: 100%; }

.reader { display: grid; gap: 16px; min-width: 0; }
.reader .rtitle { font: 600 22px/1.3 var(--serif); }
.meta { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--muted); font-size: 13px; }
.meta a { color: var(--accent); }
.abstract { font: 17px/1.65 var(--serif); max-width: 72ch; white-space: pre-wrap; overflow-wrap: anywhere; }
.abstract.none { font-style: italic; color: var(--muted); }
mark.i { background: var(--hl-inc); color: inherit; border-radius: 2px; padding: 0 1px; }
mark.e { background: var(--hl-exc); color: inherit; border-radius: 2px; padding: 0 1px; }
.decide { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.decide button { justify-content: center; padding: 12px; font-size: 15px; font-weight: 600; }
.decide .inc { color: var(--inc); border-color: var(--inc); }
.decide .exc { color: var(--exc); border-color: var(--exc); }
.decide .may { color: var(--may); border-color: var(--may); }
.decide .inc.on { background: var(--inc); color: var(--surface); }
.decide .exc.on { background: var(--exc); color: var(--surface); }
.decide .may.on { background: var(--may); color: var(--surface); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { font-size: 12px; padding: 4px 9px; border-radius: 12px; }
.chips button[aria-pressed="true"] { background: var(--exc-soft); color: var(--exc); border-color: var(--exc); }
.navrow { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; align-items: center; }

/* Duplicates */
.group { display: grid; gap: 10px; }
.members { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; }
.member { border: 1px solid var(--line); border-radius: 6px; padding: 12px; display: grid; gap: 6px; align-content: start; min-width: 0; }
.member.keep { border-color: var(--inc); box-shadow: inset 0 3px 0 var(--inc); }
.member.dup { opacity: .75; border-style: dashed; }
.member .mt { font: 600 14px/1.35 var(--serif); overflow-wrap: anywhere; }
.member .ab { font-size: 12.5px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; padding: 4px 10px; font-size: 12px; }
.seg button[aria-pressed="true"].k { background: var(--inc); color: var(--surface); }
.seg button[aria-pressed="true"].d { background: var(--exc); color: var(--surface); }

/* Compare */
.conf { display: grid; gap: 8px; border-bottom: 1px solid var(--line); padding-bottom: 14px; }
.conf:last-child { border-bottom: 0; }
.conf .ct { font: 600 15px/1.35 var(--serif); cursor: pointer; }
.conf details summary { cursor: pointer; color: var(--accent); font-size: 13px; }
.votes { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 9px 16px; border-radius: 6px; z-index: 20; font-size: 14px; max-width: calc(100% - 32px); }
.confirm { border: 1px solid var(--exc); background: var(--exc-soft); border-radius: 6px; padding: 12px; display: grid; gap: 8px; }
.empty { text-align: center; padding: 40px 16px; display: grid; gap: 12px; justify-items: center; }
.steps { margin: 0; padding-left: 20px; display: grid; gap: 6px; }

@media (max-width: 760px) {
  .screen { grid-template-columns: 1fr; }
  .listpane { position: static; max-height: none; }
  .reclist { max-height: 240px; }
  .who { margin-left: 0; }
  .reader .rtitle { font-size: 19px; }
  .abstract { font-size: 16px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand"><b>Twofold</b><span class="proj" id="projName"></span></div>
    <nav class="tabs" id="tabs" aria-label="Sections">
      <button data-tab="import">Import</button>
      <button data-tab="dups">Duplicates <span class="count" id="cDups" hidden></span></button>
      <button data-tab="screen">Screen <span class="count" id="cScreen" hidden></span></button>
      <button data-tab="compare">Compare <span class="count" id="cConf" hidden></span></button>
      <button data-tab="export">Export</button>
    </nav>
    <div class="who">
      <span class="label">Reviewer</span>
      <input type="text" id="reviewerName" placeholder="Your name" size="12" aria-label="Your reviewer name">
    </div>
  </div>
</header>

<main class="wrap">
  <section class="view" id="view-import" hidden></section>
  <section class="view" id="view-dups" hidden></section>
  <section class="view" id="view-screen" hidden></section>
  <section class="view" id="view-compare" hidden></section>
  <section class="view" id="view-export" hidden></section>
</main>
<div class="toast" id="toast" hidden></div>

<script>
"use strict";
/* ---------- state ---------- */
const DEFAULT_REASONS = ["Wrong population", "Wrong intervention", "Wrong comparator", "Wrong outcome", "Wrong study design", "Wrong publication type", "Not in English", "No abstract / insufficient info", "Other"];
const DEFAULT_KW = { inc: ["randomized", "randomised", "controlled trial", "cohort", "case-control"], exc: ["review", "case report", "mice", "rats", "animal", "in vitro", "protocol"] };
function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); }
function freshState() {
  return { v: 1, projectId: uid(), name: "Untitled review", records: [], sources: [], dupPairs: [], removed: {}, notDup: {}, dupHistory: [],
    reviewer: "", decisions: {}, others: {}, final: {}, keywords: JSON.parse(JSON.stringify(DEFAULT_KW)), reasons: DEFAULT_REASONS.slice(),
    ui: { tab: "import", filter: "todo", cur: null, cmpA: null, cmpB: null, cmpFilter: "open" } };
}
let S = freshState();
let byId = new Map();
function reindex() { byId = new Map(S.records.map(r => [r.id, r])); }

/* ---------- storage (IndexedDB, with in-memory fallback) ---------- */
const store = {
  db: null,
  async open() {
    if (this.db) return this.db;
    this.db = await new Promise((res, rej) => {
      const rq = indexedDB.open("twofold-screening", 1);
      rq.onupgradeneeded = () => rq.result.createObjectStore("kv");
      rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error);
    });
    return this.db;
  },
  async get(k) { try { const db = await this.open(); return await new Promise((res, rej) => { const rq = db.transaction("kv").objectStore("kv").get(k); rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error); }); } catch (e) { return null; } },
  async set(k, v) { try { const db = await this.open(); await new Promise((res, rej) => { const tx = db.transaction("kv", "readwrite"); tx.objectStore("kv").put(v, k); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); } catch (e) { /* storage unavailable: keep working in memory */ } }
};
let saveTimer = null;
function save(now) { clearTimeout(saveTimer); if (now) store.set("state", S); else saveTimer = setTimeout(() => { saveTimer = null; store.set("state", S); }, 250); }
addEventListener("pagehide", () => { if (saveTimer) save(true); });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden" && saveTimer) save(true); });

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]); }
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2600); }
function fnv(str) { let h = 0x811c9dc5; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193); } return (h >>> 0).toString(36); }
function normTitle(t) { return (t || "").toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g, "").replace(/<[^>]+>/g, " ").replace(/[^a-z0-9]+/g, " ").trim(); }
function normDoi(d) { return (d || "").toLowerCase().trim().replace(/^https?:\/\/(dx\.)?doi\.org\//, "").replace(/^doi:\s*/, "").trim(); }
function yearOf(s) { const m = String(s || "").match(/\b(1[89]\d{2}|20\d{2})\b/); return m ? m[1] : ""; }
function shortAuthors(a) { if (!a) return ""; const parts = a.split(/;|\s+and\s+|\|/).map(x => x.trim()).filter(Boolean); return parts.length > 2 ? parts[0] + " et al." : parts.join("; "); }
function active() { return S.records.filter(r => !S.removed[r.id]); }
function plural(n, w, p) { return n + " " + (n === 1 ? w : (p || w + "s")); }

async function saveFile(filename, text) {
  const viewer = window.claude && typeof window.claude.use === "function" ? await window.claude.use("downloads").catch(() => null) : null;
  if (viewer) {
    try { await viewer.save({ filename, data: text }); toast("Saved " + filename); }
    catch (e) { if (e && e.code !== "declined") toast("Could not save the file here (" + (e.code || "error") + ")."); }
    return;
  }
  const url = URL.createObjectURL(new Blob([text], { type: filename.endsWith(".csv") ? "text/csv" : "application/json" }));
  const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
function slug(s) { return (s || "review").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40) || "review"; }
function readFile(file) { return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = () => rej(fr.error); fr.readAsText(file); }); }

/* ---------- CSV ---------- */
function parseCSV(text) {
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const nl = text.indexOf("\n"); const first = nl > 0 ? text.slice(0, nl) : text;
  const delim = [",", ";", "\t"].map(d => [d, first.split(d).length]).sort((a, b) => b[1] - a[1])[0][0];
  const rows = []; let row = [], f = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"' && f === "") q = true;
    else if (c === delim) { row.push(f); f = ""; }
    else if (c === "\n") { row.push(f); rows.push(row); row = []; f = ""; }
    else if (c !== "\r") f += c;
  }
  if (f !== "" || row.length) { row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim() !== ""));
}
function csvCell(v) { v = String(v ?? ""); return /[",\n\r;]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
function toCSV(rows) { return "﻿" + rows.map(r => r.map(csvCell).join(",")).join("\r\n"); }

const FIELDS = {
  title: { label: "Title", names: ["title", "article title", "document title", "ti", "primary title", "paper title"] },
  abstract: { label: "Abstract", names: ["abstract", "ab", "abstract note", "abstracts", "summary"] },
  authors: { label: "Authors", names: ["authors", "author", "au", "author full names", "author names", "creators", "author(s)"] },
  year: { label: "Year", names: ["year", "publication year", "py", "pubyear", "pub year", "year published", "publication date", "date", "create date", "pubdate"] },
  journal: { label: "Journal", names: ["journal", "source title", "journal/book", "publication title", "so", "secondary title", "journal title", "source", "publication"] },
  doi: { label: "DOI", names: ["doi", "di", "doi link", "doi url"] },
  pmid: { label: "PMID", names: ["pmid", "pubmed id", "pubmed_id", "pubmedid"] },
  keywords: { label: "Keywords", names: ["keywords", "author keywords", "mesh terms", "de", "kw", "index keywords"] },
  url: { label: "URL", names: ["url", "link", "links"] }
};
function autoMap(header) {
  const h = header.map(x => x.trim().toLowerCase().replace(/^"|"$/g, ""));
  const map = {}; const used = new Set();
  for (const [k, def] of Object.entries(FIELDS)) {
    let idx = -1;
    for (const n of def.names) { const i = h.findIndex((x, j) => x === n && !used.has(j)); if (i >= 0) { idx = i; break; } }
    if (idx < 0 && k === "title") idx = h.findIndex((x, j) => !used.has(j) && x.includes("title") && !/source|journal|publication|book|short|secondary|series/.test(x));
    if (idx < 0 && k === "abstract") idx = h.findIndex((x, j) => !used.has(j) && x.includes("abstract"));
    if (idx < 0 && k === "doi") idx = h.findIndex((x, j) => !used.has(j) && x.includes("doi"));
    map[k] = idx; if (idx >= 0) used.add(idx);
  }
  return map;
}

/* ---------- import ---------- */
let pending = null; // { files:[{name, rows, header}], map }
function addRecords(rows, header, map, sourceName) {
  const taken = new Set(S.records.map(r => r.id));
  let added = 0;
  for (const row of rows) {
    const g = k => (map[k] >= 0 ? (row[map[k]] || "").trim() : "");
    const rec = { title: g("title"), abstract: g("abstract"), authors: g("authors"), year: yearOf(g("year")), journal: g("journal"), doi: normDoi(g("doi")), pmid: g("pmid").replace(/\D/g, ""), keywords: g("keywords"), url: g("url"), source: sourceName };
    if (!rec.title && !rec.abstract) continue;
    let base = "r" + fnv((rec.doi || normTitle(rec.title)) + "|" + rec.year + "|" + normTitle(rec.authors).slice(0, 20));
    let id = base, n = 2; while (taken.has(id)) id = base + "-" + n++;
    taken.add(id); rec.id = id; S.records.push(rec); added++;
  }
  S.sources.push({ name: sourceName, count: added, at: new Date().toISOString() });
  return added;
}

/* ---------- duplicate detection ---------- */
function bigrams(s) { const t = s.replace(/ /g, ""); const m = new Map(); for (let i = 0; i < t.length - 1; i++) { const b = t.substr(i, 2); m.set(b, (m.get(b) || 0) + 1); } return { m, n: Math.max(1, t.length - 1) }; }
function dice(a, b) { let inter = 0; const [x, y] = a.m.size < b.m.size ? [a, b] : [b, a]; for (const [k, v] of x.m) { const w = y.m.get(k); if (w) inter += Math.min(v, w); } return 2 * inter / (a.n + b.n); }
const RANK = { doi: 4, pmid: 4, title: 3, fuzzy: 1 };
function detectDuplicates() {
  const recs = S.records; const pairs = new Map();
  const add = (a, b, reason, score) => {
    if (a === b) return; const [x, y] = a < b ? [a, b] : [b, a]; const k = x + "|" + y; const p = pairs.get(k);
    if (!p || RANK[reason] > RANK[p.reason]) pairs.set(k, { a: x, b: y, reason, score });
  };
  const bucket = (keyFn, reason) => {
    const m = new Map();
    for (const r of recs) { const k = keyFn(r); if (!k) continue; if (!m.has(k)) m.set(k, []); m.get(k).push(r.id); }
    for (const ids of m.values()) if (ids.length > 1 && ids.length < 50) for (let i = 1; i < ids.length; i++) add(ids[0], ids[i], reason, 1);
  };
  bucket(r => r.doi, "doi");
  bucket(r => r.pmid, "pmid");
  bucket(r => { const t = normTitle(r.title); return t.length >= 15 ? t : ""; }, "title");
  // fuzzy titles (sorted neighbourhood): sort titles three ways (as written, reversed, words alphabetised)
  // and compare each title with its close neighbours, so spelling variants and small typos still meet
  const prep = recs.map(r => { const t = normTitle(r.title); return { id: r.id, t, year: r.year, bg: t.length >= 15 ? bigrams(t) : null }; }).filter(p => p.bg);
  const keys = [p => p.t, p => p.t.split("").reverse().join(""), p => p.t.split(" ").sort().join(" ")];
  const seen = new Set();
  for (const key of keys) {
    const order = prep.map(p => [key(p), p]).sort((a, b) => a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0).map(x => x[1]);
    for (let i = 0; i < order.length; i++) for (let j = i + 1; j < Math.min(order.length, i + 12); j++) {
      const p = order[i], q = order[j]; if (q.t === p.t) continue;
      const k = pairKey(p.id, q.id); if (seen.has(k)) continue; seen.add(k);
      const lr = Math.min(p.t.length, q.t.length) / Math.max(p.t.length, q.t.length); if (lr < 0.75) continue;
      const sc = dice(p.bg, q.bg);
      const yearsFar = p.year && q.year && Math.abs(+p.year - +q.year) > 1;
      if (sc >= (yearsFar ? 0.96 : 0.88)) add(p.id, q.id, "fuzzy", sc);
    }
  }
  S.dupPairs = [...pairs.values()];
}
function pairKey(a, b) { return a < b ? a + "|" + b : b + "|" + a; }
function dupGroups() {
  const live = S.dupPairs.filter(p => !S.removed[p.a] && !S.removed[p.b] && !S.notDup[pairKey(p.a, p.b)] && byId.has(p.a) && byId.has(p.b));
  const parent = new Map(); const find = x => { while (parent.get(x) !== x) { parent.set(x, parent.get(parent.get(x))); x = parent.get(x); } return x; };
  for (const p of live) { if (!parent.has(p.a)) parent.set(p.a, p.a); if (!parent.has(p.b)) parent.set(p.b, p.b); parent.set(find(p.a), find(p.b)); }
  const groups = new Map();
  for (const id of parent.keys()) { const r = find(id); if (!groups.has(r)) groups.set(r, { ids: [], pairs: [] }); groups.get(r).ids.push(id); }
  for (const p of live) groups.get(find(p.a)).pairs.push(p);
  return [...groups.values()].map(g => { g.exact = g.pairs.every(p => p.reason !== "fuzzy"); g.best = Math.max(...g.pairs.map(p => p.score)); return g; })
    .sort((a, b) => (b.exact - a.exact) || (b.best - a.best));
}
function completeness(r) { return (r.abstract || "").length + (r.doi ? 200 : 0) + (r.authors ? 50 : 0) + (r.year ? 20 : 0) + (r.journal ? 20 : 0); }
let dupChoice = {}; // groupKey -> {id: "keep"|"drop"}
function groupKey(g) { return g.ids.slice().sort().join(","); }
function defaultChoice(g) { const best = g.ids.slice().sort((a, b) => completeness(byId.get(b)) - completeness(byId.get(a)))[0]; const c = {}; g.ids.forEach(id => c[id] = id === best ? "keep" : "drop"); return c; }
function resolveGroup(g, choice) {
  const keep = g.ids.filter(id => choice[id] === "keep"); const drop = g.ids.filter(id => choice[id] === "drop");
  if (!keep.length) { toast("Keep at least one record."); return false; }
  const act = { removed: drop.slice(), notDup: [], keep: keep[0], at: Date.now() };
  drop.forEach(id => S.removed[id] = keep[0]);
  for (let i = 0; i < keep.length; i++) for (let j = i + 1; j < keep.length; j++) { const k = pairKey(keep[i], keep[j]); if (!S.notDup[k]) { S.notDup[k] = 1; act.notDup.push(k); } }
  S.dupHistory.push(act); delete dupChoice[groupKey(g)]; return true;
}
function undoDup(i) { const act = S.dupHistory[i]; if (!act) return; act.removed.forEach(id => delete S.removed[id]); act.notDup.forEach(k => delete S.notDup[k]); S.dupHistory.splice(i, 1); }

/* ---------- reviewers & decisions ---------- */
function reviewers() {
  const list = [{ key: "__me", name: (S.reviewer || "You") + " (this device)", decisions: S.decisions }];
  for (const [name, o] of Object.entries(S.others)) list.push({ key: name, name, decisions: o.decisions });
  return list;
}
function decide(id, d) {
  const cur = S.decisions[id];
  if (!d) { delete S.decisions[id]; }
  else S.decisions[id] = { d, reason: d === "exclude" ? (cur && cur.reason) || "" : "", note: (cur && cur.note) || "", at: new Date().toISOString() };
  save();
}

/* ---------- highlighting ---------- */
function kwRegex(list) { const words = list.map(w => w.trim()).filter(Boolean).sort((a, b) => b.length - a.length).map(w => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")); return words.length ? new RegExp("\\b(" + words.join("|") + ")", "gi") : null; }
function highlight(text) {
  let html = esc(text);
  const ri = kwRegex(S.keywords.inc), re = kwRegex(S.keywords.exc);
  // mark on escaped text; keywords are plain words so they do not collide with entities
  const marks = [];
  const scan = (rx, cls) => { if (!rx) return; html.replace(rx, (m, _g, off) => { marks.push([off, off + m.length, cls]); return m; }); };
  scan(re, "e"); scan(ri, "i");
  marks.sort((a, b) => a[0] - b[0]); let out = "", pos = 0;
  for (const [s, e, c] of marks) { if (s < pos) continue; out += html.slice(pos, s) + '<mark class="' + c + '">' + html.slice(s, e) + "</mark>"; pos = e; }
  return out + html.slice(pos);
}

async function handleCSVFiles(files) {

    catch (e) { toast("Could not read " + f.name); }
  }

  renderMapping();
}

}

let projPending = null;

      <div class="members">${g.ids.map(id => { const r = byId.get(id); const c = choice[id]; return `<div class="member ${c === "drop" ? "dup" : "keep"}">
        <div class="row" style="justify-content:space-between"><span class="label">${esc(r.source || "")}</span>
        <span class="seg"><button class="k" aria-pressed="${c === "keep"}" data-act="set" data-g="${gi}" data-id="${id}" data-v="keep">Keep</button><button class="d" aria-pressed="${c === "drop"}" data-act="set" data-g="${gi}" data-id="${id}" data-v="drop">Duplicate</button></span></div>
        <div class="mt">${esc(r.title || "(no title)")}</div>
        <div class="meta">${r.authors ? `<span>${esc(shortAuthors(r.authors))}</span>` : ""}${r.year ? `<span class="mono">${esc(r.year)}</span>` : ""}${r.journal ? `<span>${esc(r.journal)}</span>` : ""}${r.doi ? `<span class="mono">${esc(r.doi)}</span>` : ""}</div>
        <div class="ab">${esc(r.abstract || "No abstract")}</div></div>`; }).join("")}</div>
    </div>`;
  }).join("")}
  ${groups.length > 60 ? `<p class="muted">Showing the first 60 groups. Resolve these to see more.</p>` : ""}
  ${S.dupHistory.length ? `<div class="panel"><h3>Decisions made</h3><div class="tablewrap"><table><thead><tr><th>Kept</th><th>Removed</th><th></th></tr></thead><tbody>
    ${S.dupHistory.map((a, i) => ({ a, i })).reverse().slice(0, 200).map(({ a, i }) => { const r = byId.get(a.keep); return `<tr><td class="clip">${esc(r ? r.title : a.keep)}</td><td class="mono">${a.removed.length ? a.removed.length + " removed" : "kept all (not duplicates)"}</td><td><button data-act="undo" data-i="${i}">Undo</button></td></tr>`; }).join("")}

  $("#rescan").onclick = () => { detectDuplicates(); dupChoice = {}; save(); render(); toast("Scan finished."); };

  const base = slug(S.name);
  $("#exProject").onclick = () => saveFile(base + "-project.json", JSON.stringify({ type: "twofold-project", version: 1, projectId: S.projectId, name: S.name, exportedAt: new Date().toISOString(), records: S.records, sources: S.sources, dupPairs: S.dupPairs, removed: S.removed, notDup: S.notDup, dupHistory: S.dupHistory, keywords: S.keywords, reasons: S.reasons }));
  $("#exMine").onclick = () => saveFile(base + "-decisions-" + slug(S.reviewer || "reviewer") + ".json", JSON.stringify({ type: "twofold-decisions", version: 1, projectId: S.projectId, project: S.name, reviewer: S.reviewer || "Reviewer", exportedAt: new Date().toISOString(), decisions: S.decisions }));
  const resultRows = only => {
    const revs = reviewers(); const cd = compareData();
    const byRow = new Map(cd ? cd.rows.map(x => [x.r.id, x]) : []);
    const finOf = id => { const x = byRow.get(id); return x ? (x.fin || "") : (S.final[id] || ""); };
    const statusOf = id => { const x = byRow.get(id); return x ? x.status : ""; };
    const header = ["id", "title", "authors", "year", "journal", "doi", "pmid", "abstract", "source"];
    revs.forEach(r => header.push(r.name.replace(" (this device)", "") + " decision", "reason", "note"));
    header.push("agreement", "final decision");
    const rows = [header];
    for (const r of act) {
      const fin = finOf(r.id); if (only && fin !== "include") continue;
      const row = [r.id, r.title, r.authors, r.year, r.journal, r.doi, r.pmid, r.abstract, r.source];
      revs.forEach(rv => { const d = rv.decisions[r.id]; row.push(d ? d.d : "", d ? d.reason : "", d ? d.note : ""); });
      row.push(statusOf(r.id).replace("bothmaybe", "both maybe").replace("single", "one reviewer only").replace("none", "not screened"), fin);
      rows.push(row);
    }
    return toCSV(rows);
  };
  $("#exResults").onclick = () => saveFile(base + "-screening-results.csv", resultRows(false));
  $("#exIncluded").onclick = () => saveFile(base + "-included.csv", resultRows(true));
  $("#exDups").onclick = () => { const rows = [["removed id", "title", "authors", "year", "doi", "source", "kept id", "kept title"]]; for (const [id, keep] of Object.entries(S.removed)) { const r = byId.get(id), k = byId.get(keep); if (r) rows.push([id, r.title, r.authors, r.year, r.doi, r.source, keep, k ? k.title : ""]); } saveFile(base + "-duplicates-removed.csv", toCSV(rows)); };
}
